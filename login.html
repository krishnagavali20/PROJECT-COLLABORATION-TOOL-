<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexus Workspace</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<!-- Soft, neutral background used by real SaaS apps -->
<body class="bg-[#F4F5F7] flex items-center justify-center h-screen font-sans text-gray-900">
  
  <!-- Crisp, flat card design with subtle shadows -->
  <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 w-full max-w-md">
    
    <!-- Minimalist Branding -->
    <div class="flex justify-center mb-6">
      <div class="w-10 h-10 bg-blue-600 rounded-md flex items-center justify-center shadow-sm">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
    </div>
    
    <div class="text-center mb-8">
      <h1 class="text-xl font-semibold text-gray-900 tracking-tight">Log in to Nexus</h1>
      <p class="text-sm text-gray-500 mt-1">Continue to your workspace</p>
    </div>
    
    <!-- Clean, structured form -->
    <form class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Email</label>
        <input 
          type="email" 
          placeholder="Enter your email" 
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
        >
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Password</label>
        <input 
          type="password" 
          placeholder="Enter password" 
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
        >
      </div>
      
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-md text-sm transition duration-150 ease-in-out mt-2"
      >
        Continue
      </button>
    </form>
    
    <!-- Separator -->
    <div class="mt-6 flex items-center justify-between">
      <span class="border-b w-1/5 lg:w-1/4"></span>
      <a href="#" class="text-xs text-center text-gray-500 uppercase">or log in with</a>
      <span class="border-b w-1/5 lg:w-1/4"></span>
    </div>

    <!-- Secondary Action Button -->
    <button class="w-full mt-4 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2.5 rounded-md text-sm transition duration-150 ease-in-out flex justify-center items-center gap-2">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google
    </button>

    <!-- Footer Links -->
    <div class="mt-8 pt-6 border-t border-gray-100 text-center text-sm">
      <a href="#" class="text-blue-600 hover:underline">Can't log in?</a>
      <span class="text-gray-300 mx-2">•</span>
      <a href="#" class="text-blue-600 hover:underline">Sign up for an account</a>
    </div>
    
  </div>
</body>
</html>

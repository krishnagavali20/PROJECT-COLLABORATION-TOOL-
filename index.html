<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Nexus Workspace</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#F4F5F7] h-screen flex flex-col font-sans text-gray-900 overflow-hidden">
  
  <!-- Minimalist Top Navigation -->
  <nav class="bg-white border-b border-gray-200 px-5 py-2.5 flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-6">
      <div class="flex items-center gap-2">
        <!-- Solid, simple logo mark -->
        <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <h1 class="text-lg font-semibold tracking-tight text-gray-900">Nexus</h1>
      </div>
      
      <!-- Clean navigation links -->
      <div class="hidden md:flex items-center space-x-1">
        <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md transition">Projects</button>
        <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md transition">Filters</button>
        <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md transition">Dashboards</button>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3 py-1.5 rounded-md shadow-sm transition">
        Create Task
      </button>
      <!-- Standard User Avatar -->
      <div class="w-8 h-8 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center text-xs font-semibold text-gray-600 cursor-pointer hover:bg-gray-300 transition">
        JD
      </div>
    </div>
  </nav>

  <!-- Board Header Context -->
  <header class="px-6 py-4 flex flex-col sm:flex-row sm:justify-between sm:items-center shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gray-200 rounded-md flex items-center justify-center text-gray-500 font-bold text-lg">
        FD
      </div>
      <div>
        <h2 class="text-xl font-semibold text-gray-900">Frontend Development</h2>
        <p class="text-sm text-gray-500">Sprint 4 • Active</p>
      </div>
    </div>
    
    <div class="mt-3 sm:mt-0 flex items-center gap-2">
      <!-- Avatar Stack -->
      <div class="flex -space-x-2 mr-2">
        <div class="w-7 h-7 rounded-full bg-blue-100 border-2 border-[#F4F5F7] flex items-center justify-center text-xs font-bold text-blue-700 z-20">JD</div>
        <div class="w-7 h-7 rounded-full bg-green-100 border-2 border-[#F4F5F7] flex items-center justify-center text-xs font-bold text-green-700 z-10">AS</div>
        <div class="w-7 h-7 rounded-full bg-purple-100 border-2 border-[#F4F5F7] flex items-center justify-center text-xs font-bold text-purple-700 z-0">+2</div>
      </div>
      <button class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-md text-sm font-medium shadow-sm transition">
        Share
      </button>
    </div>
  </header>

  <!-- Kanban Canvas -->
  <main class="flex-1 overflow-x-auto px-6 pb-6 flex gap-4 items-start">
    
    <!-- Column 1: To Do -->
    <div class="bg-gray-100/80 w-72 rounded-lg p-2.5 flex-shrink-0 flex flex-col border border-gray-200/60">
      <div class="flex justify-between items-center mb-2 px-1.5 py-1">
        <h3 class="font-semibold text-gray-700 text-sm uppercase tracking-wide">To Do <span class="text-gray-400 font-normal ml-1">2</span></h3>
        <button class="text-gray-400 hover:text-gray-700 rounded p-1 hover:bg-gray-200 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
        </button>
      </div>
      
      <!-- Cards Container -->
      <div class="flex flex-col gap-2 overflow-y-auto max-h-[65vh] p-0.5">
        
        <!-- Task Card -->
        <div class="bg-white p-3 rounded-md shadow-sm border border-gray-200 cursor-pointer hover:border-blue-500 hover:shadow transition duration-150 group">
          <div class="flex gap-1.5 mb-2">
             <span class="bg-blue-50 text-blue-700 border border-blue-100 text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">Design</span>
          </div>
          <p class="text-sm text-gray-800 font-medium leading-snug mb-3">Design responsive frontend pages (Home, Login, Dashboard)</p>
          <div class="flex justify-between items-center">
            <span class="text-xs text-gray-500 font-medium">NEX-101</span>
            <!-- Hidden avatar reveals on hover for assignment -->
            <div class="w-5 h-5 rounded-full border border-dashed border-gray-300 flex items-center justify-center text-gray-400 opacity-0 group-hover:opacity-100 transition">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
          </div>
        </div>

        <!-- Task Card -->
        <div class="bg-white p-3 rounded-md shadow-sm border border-gray-200 cursor-pointer hover:border-blue-500 hover:shadow transition duration-150 group">
          <p class="text-sm text-gray-800 font-medium leading-snug mb-3">Setup Tailwind CSS architecture</p>
          <div class="flex justify-between items-center">
            <span class="text-xs text-gray-500 font-medium">NEX-102</span>
            <div class="w-5 h-5 rounded-full bg-purple-100 flex items-center justify-center text-[10px] font-bold text-purple-700">AS</div>
          </div>
        </div>
      </div>
      
      <button class="mt-2 flex items-center text-gray-500 hover:text-gray-800 hover:bg-gray-200 p-1.5 rounded-md transition duration-150 text-sm font-medium w-full">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        Create issue
      </button>
    </div>

    <!-- Column 2: In Progress -->
    <div class="bg-gray-100/80 w-72 rounded-lg p-2.5 flex-shrink-0 flex flex-col border border-gray-200/60">
      <div class="flex justify-between items-center mb-2 px-1.5 py-1">
        <h3 class="font-semibold text-gray-700 text-sm uppercase tracking-wide">In Progress <span class="text-gray-400 font-normal ml-1">1</span></h3>
        <button class="text-gray-400 hover:text-gray-700 rounded p-1 hover:bg-gray-200 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
        </button>
      </div>
      
      <div class="flex flex-col gap-2 overflow-y-auto max-h-[65vh] p-0.5">
        <div class="bg-white p-3 rounded-md shadow-sm border border-gray-200 cursor-pointer hover:border-blue-500 hover:shadow transition duration-150 group border-l-2 border-l-blue-500">
          <div class="flex gap-1.5 mb-2">
             <span class="bg-green-50 text-green-700 border border-green-100 text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">Exp 1</span>
          </div>
          <p class="text-sm text-gray-800 font-medium leading-snug mb-3">Build interactive UIs using Tailwind CSS</p>
          <div class="flex justify-between items-center">
            <span class="text-xs text-gray-500 font-medium">NEX-103</span>
            <div class="w-5 h-5 rounded-full bg-blue-100 flex items-center justify-center text-[10px] font-bold text-blue-700">JD</div>
          </div>
        </div>
      </div>
      
      <button class="mt-2 flex items-center text-gray-500 hover:text-gray-800 hover:bg-gray-200 p-1.5 rounded-md transition duration-150 text-sm font-medium w-full">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        Create issue
      </button>
    </div>

    <!-- Create New Column -->
    <button class="flex-shrink-0 w-72 bg-gray-100/50 hover:bg-gray-100 border border-dashed border-gray-300 text-gray-600 rounded-lg p-3 text-sm font-medium transition duration-150 flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
      Add Column
    </button>

  </main>
</body>
</html>
